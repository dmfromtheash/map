minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit]

# Быстрый commit-gate: структура, локальные ссылки и контракт активного prompt.
# Exact commits закрепляют исполняемый hook code; комментарий сохраняет release tag.
# Security-проверки выбираются по trust boundary в docs/11_CODEX_VERIFICATION_PROTOCOL.md.

repos:
  - repo: local
    hooks:
      - id: stage-prompt-contract
        name: active Codex stage prompt contract
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-stage-prompts.ps1
        language: system
        pass_filenames: false
        files: ^docs/prompts/.*\.md$

      - id: version-consistency
        name: Map version consistency
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-version-consistency.ps1
        language: system
        pass_filenames: false
        files: ^(CHANGELOG\.md|Directory\.Build\.props|version\.json|docs/12_RELEASE_VERSIONING_AND_ROLLBACK\.md|src/Map\.App/AppVersion\.cs|src/Map\.App/MainWindow\.cs|src/Map\.Presentation/ViewModels/EditorViewModel\.cs|scripts/check-version-consistency\.ps1)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: forbid-submodules
      - id: mixed-line-ending
        args: ["--fix=no"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/lycheeverse/lychee
    rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b  # lychee-v0.24.2
    hooks:
      - id: lychee-system
        args: ["--offline", "--include-fragments", "--no-progress"]
