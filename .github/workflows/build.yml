name: build

# Independent check of every push: Release build of Map.slnx and the five unit test projects
# on a clean Windows runner (DEC-050). Native window smokes (tools/Map.Performance) stay local.
# Map.Core.Tests and Map.Assets.Tests gate the run directly. Rendering, Persistence and Presentation
# carry long-standing failures (docs/00_STAGE_PROTOCOL.md §J): they run fully, and
# tools/ci/Test-KnownFailures.ps1 compares the .trx results with tests/KnownFailures.txt — any failure
# NOT in that list turns the job red (R00, DEC-052). A known failure that starts passing is reported
# as a notice so the list can be trimmed.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege for the job token (R00, agent-security note 2026-10-21): the build only reads the repo.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Release (Map.slnx)
        run: dotnet build .\Map.slnx -c Release -nologo

      - name: Unit tests (gate)
        shell: pwsh
        run: |
          foreach ($p in 'Map.Core.Tests','Map.Assets.Tests') {
            dotnet test "tests\$p\$p.csproj" -c Release -nologo --logger "trx;LogFileName=$p.trx" --results-directory artifacts\test-results
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$p failed"; exit 1 }
          }

      - name: Unit tests (known failures filtered)
        shell: pwsh
        run: |
          foreach ($p in 'Map.Rendering.Tests','Map.Persistence.Tests','Map.Presentation.Tests') {
            $testSettings = @()
            if ($p -eq 'Map.Presentation.Tests') { $testSettings = @('--','xUnit.ParallelizeTestCollections=false') }
            dotnet test "tests\$p\$p.csproj" -c Release -nologo --logger "trx;LogFileName=$p.trx" --results-directory artifacts/test-results @testSettings
            Write-Host "$p exit code $LASTEXITCODE (judged by Test-KnownFailures)"
            if (-not (Test-Path -LiteralPath "artifacts/test-results/$p.trx")) {
              Write-Host "::error::$p did not produce a test report"; exit 1
            }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/Test-KnownFailures.ps1 -ResultsDir artifacts/test-results -KnownList tests/KnownFailures.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::new test failures outside tests/KnownFailures.txt"; exit 1 }

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
