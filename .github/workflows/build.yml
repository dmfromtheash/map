name: build

# Checks on a clean Windows runner (DEC-086, replaces the every-push rule of DEC-050/052).
# Runs only for code on main: a push to the work branch is the same commit, and a commit that changes
# only documents, prompts or memory changes nothing to build. Native window smokes, speed and looks
# stay local (tools/Map.Performance on this PC and on USER).
#   quick (~5 min) — Release build of Map.slnx and of the smoke tools, Core/Assets/Persistence tests.
#                    Claude waits for this one before calling the work done.
#   full (~25 min) — Rendering and Presentation tests. Runs in parallel; looked at before closing a
#                    package and at the start of the next session. A release tag waits for both.
# Tests run through tools/ci/Invoke-TestProject.ps1: known-failure list, one retry of up to 3 failed
# tests (a test passing on retry is a ::warning:: to fix, not red).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '.claude/**'
      - 'tools/ai/**'
      - '**/*.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Release (Map.slnx)
        run: dotnet build .\Map.slnx -c Release -nologo

      - name: Build smoke and live-check tools
        run: |
          dotnet build .\tools\Map.Performance\Map.Performance.csproj -c Release -nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet build .\tools\Map.LiveCheck\Map.LiveCheck.csproj -c Release -nologo

      - name: Tests Core, Assets, Persistence
        shell: pwsh
        run: |
          foreach ($p in 'Map.Core.Tests','Map.Assets.Tests','Map.Persistence.Tests') {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/Invoke-TestProject.ps1 -Project $p
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$p failed"; exit 1 }
          }

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-quick
          path: artifacts/test-results
          if-no-files-found: ignore

  full:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Tests Rendering, Presentation
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/Invoke-TestProject.ps1 -Project Map.Rendering.Tests
          $r = $LASTEXITCODE
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/Invoke-TestProject.ps1 -Project Map.Presentation.Tests -RunSettings 'xUnit.ParallelizeTestCollections=false'
          if ($r -ne 0 -or $LASTEXITCODE -ne 0) { Write-Host "::error::full tests failed"; exit 1 }

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-full
          path: artifacts/test-results
          if-no-files-found: ignore
