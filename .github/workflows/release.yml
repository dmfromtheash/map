name: release

# Pushing a tag v<version> (or running by hand) builds the downloadable zip with
# tools/release/publish-release.ps1 and attaches it to the GitHub release of that tag (DEC-050).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build release zip
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/publish-release.ps1

      - name: Zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Map-win-x64
          path: artifacts/release/*.zip

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = (Get-ChildItem artifacts\release\*.zip | Select-Object -First 1).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Map $tag" --notes-file tools/release/RELEASE_NOTES.md $zip
          } else {
            gh release upload $tag $zip --clobber
          }
